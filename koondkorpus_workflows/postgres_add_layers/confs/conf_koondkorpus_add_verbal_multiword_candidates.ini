[database]
#pgpass_file = pgpass.txt
schema = koondkorpus
role = koondkorpus_create

[tagger]
collection = koondkorpus_base_subset_of_5000_v2
#collection = koondkorpus_base_v2
output_layer = v176_verbal_mwe
words_layer = v166_words
sentences_layer = v166_sentences
clauses_layer = v169_clauses
syntax_layer = v175_stanza_syntax
include_nonfinite = True
include_compound_verbs = True
include_copula_heads = True
sparse = True
#lexicon_path = verbal_multiword_lexicon.json
#dry_run = True
